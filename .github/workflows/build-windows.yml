name: Windows suite
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Test source and analysis
        shell: pwsh
        run: |
          $env:PYTHONPATH = "src"
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s analysis -p 'test_*.py' -v
      - name: Install build-only tools
        run: python -m pip install -r requirements-build.txt
      - name: Build and verify both executables
        run: python tools/build_windows_suite.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RxDataLint-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
            dist/validation-*.json
            build/**/smoke-*/*.json
