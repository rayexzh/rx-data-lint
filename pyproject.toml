[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rx-data-lint"
version = "0.1.0"
description = "Local-first data quality checks for NHS medicines datasets"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "RxDataLint contributors"}]
keywords = ["nhs", "medicines", "scmd", "data-quality", "pharmaceutical"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.scripts]
rx-data-lint = "rxdatalint.cli:main"
rx-data-lint-gui = "rxdatalint.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
